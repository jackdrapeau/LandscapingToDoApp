<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Landscaping Project Manager</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Light mode tokens ── */
    :root {
      --bg-page:        #f0f4f0;
      --bg-card:        #ffffff;
      --bg-footer:      #f8fbf8;
      --bg-input:       #ffffff;
      --color-text:     #2d3a2d;
      --color-subtle:   #6b8f6b;
      --color-label:    #aaa;
      --color-accent:   #2e6b2e;
      --color-accent-h: #245524;
      --border-card:    #eef4ee;
      --border-input:   #d4e4d4;
      --border-add:     #b0ccb0;
      --color-add-btn:  #4a8a4a;
      --bg-add-hover:   #f0f8f0;
      --bg-progress:    #e0ece0;
      --color-progress: #999;
      --color-del-task: #c0c0c0;
      --color-done:     #999;
      --shadow-card:    rgba(0,0,0,0.08);
    }

    /* ── Dark mode tokens ── */
    html.dark {
      --bg-page:        #161e16;
      --bg-card:        #1e2a1e;
      --bg-footer:      #192119;
      --bg-input:       #243024;
      --color-text:     #d4e8d4;
      --color-subtle:   #7aaa7a;
      --color-label:    #668866;
      --color-accent:   #4a9e4a;
      --color-accent-h: #3d853d;
      --border-card:    #2a3a2a;
      --border-input:   #3a5a3a;
      --border-add:     #3a5a3a;
      --color-add-btn:  #6ab86a;
      --bg-add-hover:   #1e2e1e;
      --bg-progress:    #2a3a2a;
      --color-progress: #668866;
      --color-del-task: #556655;
      --color-done:     #557755;
      --shadow-card:    rgba(0,0,0,0.35);
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg-page);
      color: var(--color-text);
      min-height: 100vh;
      padding: 24px 16px;
      transition: background 0.2s, color 0.2s;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
      position: relative;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      color: var(--color-accent);
      letter-spacing: -0.5px;
    }

    header p {
      color: var(--color-subtle);
      margin-top: 4px;
      font-size: 0.95rem;
    }

    /* ── Dark mode toggle ── */
    .dark-toggle {
      position: absolute;
      top: 0;
      right: 0;
      background: var(--bg-card);
      border: 1px solid var(--border-input);
      color: var(--color-text);
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }

    .dark-toggle:hover { border-color: var(--color-accent); }

    .toolbar {
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
    }

    .btn-primary {
      background: var(--color-accent);
      color: #fff;
      border: none;
      padding: 10px 22px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-primary:hover { background: var(--color-accent-h); }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .project-card {
      background: var(--bg-card);
      border-radius: 12px;
      box-shadow: 0 2px 8px var(--shadow-card);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: background 0.2s, box-shadow 0.2s;
    }

    .project-header {
      background: var(--color-accent);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: background 0.2s;
    }

    .project-name-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 1.05rem;
      font-weight: 600;
    }

    .project-name-input::placeholder { color: rgba(255,255,255,0.65); }

    .btn-delete-project {
      background: rgba(255,255,255,0.15);
      border: none;
      color: #fff;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      transition: background 0.15s;
      flex-shrink: 0;
    }

    .btn-delete-project:hover { background: rgba(255,0,0,0.35); }

    .project-body { padding: 16px; flex: 1; display: flex; flex-direction: column; gap: 12px; }

    .tasks-section { display: flex; flex-direction: column; gap: 8px; }

    .section-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--color-subtle);
      margin-bottom: 4px;
    }

    .task-row {
      display: grid;
      grid-template-columns: 1fr 140px 80px 28px;
      gap: 6px;
      align-items: center;
    }

    .task-row-with-checkbox {
      grid-template-columns: 22px 1fr 140px 80px 28px;
    }

    .task-row input {
      border: 1px solid var(--border-input);
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 0.875rem;
      outline: none;
      transition: border-color 0.15s, background 0.2s, color 0.2s;
      width: 100%;
      color: var(--color-text);
      background: var(--bg-input);
    }

    .task-row input:focus { border-color: var(--color-accent); }

    .task-row input.cost-input { text-align: right; }

    .task-row input.done-task {
      text-decoration: line-through;
      color: var(--color-done);
    }

    .btn-delete-task {
      background: none;
      border: none;
      color: var(--color-del-task);
      cursor: pointer;
      font-size: 1rem;
      padding: 0;
      width: 28px;
      height: 28px;
      border-radius: 4px;
      transition: color 0.15s, background 0.15s;
    }

    .btn-delete-task:hover { color: #cc2222; background: rgba(204,34,34,0.12); }

    .task-header-row {
      display: grid;
      grid-template-columns: 1fr 140px 80px 28px;
      gap: 6px;
      padding-bottom: 2px;
    }

    .task-header-row.task-row-with-checkbox {
      grid-template-columns: 22px 1fr 140px 80px 28px;
    }

    .task-header-row span {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--color-label);
      padding: 0 8px;
    }

    .btn-add-task {
      background: none;
      border: 1px dashed var(--border-add);
      color: var(--color-add-btn);
      border-radius: 6px;
      padding: 6px;
      font-size: 0.82rem;
      cursor: pointer;
      width: 100%;
      transition: background 0.15s, border-color 0.15s;
      margin-top: 4px;
    }

    .btn-add-task:hover { background: var(--bg-add-hover); border-color: var(--color-accent); }

    .project-footer {
      border-top: 1px solid var(--border-card);
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-footer);
      transition: background 0.2s, border-color 0.2s;
    }

    .total-label { font-size: 0.8rem; color: var(--color-subtle); font-weight: 600; }

    .total-amount {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--color-accent);
    }

    .progress-bar-wrap {
      height: 4px;
      background: var(--bg-progress);
      border-radius: 2px;
      margin-bottom: 8px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: var(--color-accent);
      border-radius: 2px;
      transition: width 0.3s;
    }

    .progress-label {
      font-size: 0.72rem;
      color: var(--color-progress);
      text-align: right;
      margin-top: -4px;
      margin-bottom: 8px;
    }

    .empty-state {
      text-align: center;
      padding: 48px 16px;
      color: var(--color-subtle);
      font-size: 0.95rem;
    }

    .empty-state .icon { font-size: 3rem; margin-bottom: 12px; }

    .task-done-checkbox {
      accent-color: var(--color-accent);
      width: 15px;
      height: 15px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .task-row-inner {
      display: contents;
    }

    @media (max-width: 480px) {
      .task-row {
        grid-template-columns: 1fr 100px 68px 28px;
      }
      .task-row-with-checkbox,
      .task-header-row.task-row-with-checkbox {
        grid-template-columns: 22px 1fr 100px 68px 28px;
      }
    }

    /* ── Calendar ── */
    .calendar-section {
      max-width: 1200px;
      margin: 40px auto 0;
    }

    .calendar-section-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--color-accent);
      margin-bottom: 16px;
    }

    .calendar-card {
      background: var(--bg-card);
      border-radius: 12px;
      box-shadow: 0 2px 8px var(--shadow-card);
      overflow: hidden;
      transition: background 0.2s, box-shadow 0.2s;
    }

    .calendar-header {
      background: var(--color-accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      transition: background 0.2s;
    }

    .calendar-header h2 { font-size: 1rem; font-weight: 700; }

    .cal-nav {
      background: rgba(255,255,255,0.18);
      border: none;
      color: #fff;
      width: 30px;
      height: 30px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.15s;
    }

    .cal-nav:hover { background: rgba(255,255,255,0.35); }

    .calendar-dow {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      background: var(--bg-progress);
      border-bottom: 1px solid var(--border-card);
    }

    .calendar-dow span {
      text-align: center;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--color-subtle);
      padding: 8px 0;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      border-left: 1px solid var(--border-card);
      border-top: 1px solid var(--border-card);
    }

    .cal-day {
      min-height: 90px;
      border-right: 1px solid var(--border-card);
      border-bottom: 1px solid var(--border-card);
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      background: var(--bg-card);
      transition: background 0.2s;
    }

    .cal-day.other-month { background: var(--bg-footer); }

    .cal-day-num {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--color-subtle);
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 2px;
    }

    .cal-day.today .cal-day-num {
      background: var(--color-accent);
      color: #fff;
      border-radius: 50%;
    }

    .cal-day.other-month .cal-day-num { color: var(--color-label); }

    .cal-chip {
      font-size: 0.68rem;
      font-weight: 600;
      background: var(--bg-progress);
      color: var(--color-accent);
      border-left: 3px solid var(--color-accent);
      border-radius: 3px;
      padding: 2px 5px;
      line-height: 1.3;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      cursor: default;
    }

    .cal-chip:hover { background: var(--border-input); }

    .chip-project {
      color: var(--color-subtle);
      font-weight: 400;
      display: block;
      font-size: 0.62rem;
    }

    /* Due date input in task rows */
    .task-due-input {
      border: 1px solid var(--border-input);
      border-radius: 6px;
      padding: 5px 6px;
      font-size: 0.78rem;
      outline: none;
      transition: border-color 0.15s, background 0.2s, color 0.2s;
      width: 100%;
      color: var(--color-text);
      background: var(--bg-input);
    }

    .task-due-input:focus { border-color: var(--color-accent); }

    @media (max-width: 480px) {
      .cal-day { min-height: 60px; }
      .chip-project { display: none; }
    }
  </style>
</head>
<body>

<header>
  <button class="dark-toggle" id="darkToggle" onclick="toggleDark()">🌙 Dark</button>
  <h1>🌿 Landscaping Projects</h1>
  <p>Track projects, tasks, materials, and costs</p>
</header>

<div class="toolbar">
  <button class="btn-primary" onclick="addProject()">+ New Project</button>
</div>

<div class="projects-grid" id="projectsGrid">
  <div class="empty-state" id="emptyState">
    <div class="icon">🌱</div>
    <div>No projects yet.<br>Click <strong>+ New Project</strong> to get started.</div>
  </div>
</div>

<div class="calendar-section">
  <div class="calendar-section-title">📅 Project &amp; Task Calendar</div>
  <div class="calendar-card">
    <div class="calendar-header">
      <button class="cal-nav" id="calPrev" aria-label="Previous month">&#8249;</button>
      <h2 id="calTitle"></h2>
      <button class="cal-nav" id="calNext" aria-label="Next month">&#8250;</button>
    </div>
    <div class="calendar-dow">
      <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span>
      <span>Thu</span><span>Fri</span><span>Sat</span>
    </div>
    <div class="calendar-grid" id="calendarGrid"></div>
  </div>
</div>

<script>
  // ── Dark mode ──
  const darkToggle = document.getElementById('darkToggle');

  function applyDark(on) {
    document.documentElement.classList.toggle('dark', on);
    darkToggle.textContent = on ? '☀️ Light' : '🌙 Dark';
  }

  function toggleDark() {
    const on = !document.documentElement.classList.contains('dark');
    localStorage.setItem('lp_dark', on ? '1' : '0');
    applyDark(on);
  }

  applyDark(localStorage.getItem('lp_dark') === '1');

  // ── Projects ──
  let projects = (() => {
    try {
      const parsed = JSON.parse(localStorage.getItem('lp_projects') || '[]');
      if (!Array.isArray(parsed)) {
        console.error('lp_projects is not an array, resetting:', parsed);
        localStorage.removeItem('lp_projects');
        return [];
      }
      return parsed;
    } catch (e) {
      console.error('lp_projects corrupted, resetting:', e);
      localStorage.removeItem('lp_projects');
      return [];
    }
  })();

  function save() {
    localStorage.setItem('lp_projects', JSON.stringify(projects));
  }

  function addProject() {
    projects.push({ id: Date.now(), name: '', tasks: [] });
    save();
    render();
    // Focus the new project's name field
    const inputs = document.querySelectorAll('.project-name-input');
    if (inputs.length) inputs[inputs.length - 1].focus();
  }

  function deleteProject(id) {
    projects = projects.filter(p => p.id !== id);
    save();
    render();
  }

  function addTask(projectId) {
    const p = projects.find(p => p.id === projectId);
    if (!p) return;
    p.tasks.push({ id: Date.now(), item: '', cost: '', due: '', done: false });
    save();
    render();
    // Focus the new task name field
    const card = document.querySelector(`[data-project-id="${projectId}"]`);
    if (card) {
      const taskInputs = card.querySelectorAll('.task-input');
      if (taskInputs.length) taskInputs[taskInputs.length - 1].focus();
    }
  }

  function deleteTask(projectId, taskId) {
    const p = projects.find(p => p.id === projectId);
    if (!p) return;
    p.tasks = p.tasks.filter(t => t.id !== taskId);
    save();
    render();
  }

  function updateProject(id, field, value) {
    const p = projects.find(p => p.id === id);
    if (p) { p[field] = value; save(); }
  }

  function updateTask(projectId, taskId, field, value) {
    const p = projects.find(p => p.id === projectId);
    if (!p) return;
    const t = p.tasks.find(t => t.id === taskId);
    if (t) { t[field] = value; save(); }
    if (field === 'done') render(); // re-render to update strikethrough + progress
    if (field === 'cost') updateTotal(projectId);
    if (field === 'due') renderCalendar();
  }

  function updateTotal(projectId) {
    const p = projects.find(p => p.id === projectId);
    if (!p) return;
    const total = p.tasks.reduce((sum, t) => sum + (parseFloat(t.cost) || 0), 0);
    const el = document.querySelector(`[data-total="${projectId}"]`);
    if (el) el.textContent = '$' + total.toFixed(2);
  }

  function formatCurrency(val) {
    const n = parseFloat(val);
    return isNaN(n) ? '' : n.toFixed(2);
  }

  function render() {
    const grid = document.getElementById('projectsGrid');
    const empty = document.getElementById('emptyState');

    // Remove old cards (keep emptyState)
    grid.querySelectorAll('.project-card').forEach(el => el.remove());

    if (projects.length === 0) {
      empty.style.display = '';
      return;
    }
    empty.style.display = 'none';

    projects.forEach(p => {
      const total = p.tasks.reduce((sum, t) => sum + (parseFloat(t.cost) || 0), 0);
      const doneCount = p.tasks.filter(t => t.done).length;
      const pct = p.tasks.length ? Math.round((doneCount / p.tasks.length) * 100) : 0;

      const card = document.createElement('div');
      card.className = 'project-card';
      card.dataset.projectId = p.id;

      card.innerHTML = `
        <div class="project-header">
          <input
            class="project-name-input"
            placeholder="Project Name"
            value="${escHtml(p.name)}"
            oninput="updateProject(${p.id}, 'name', this.value)"
          >
          <button class="btn-delete-project" title="Delete project" onclick="deleteProject(${p.id})">✕</button>
        </div>
        <div class="project-body">
          <div class="tasks-section">
            <div class="task-header-row" style="grid-template-columns: 22px 1fr 72px 104px 28px">
              <span></span>
              <span>Item / Task</span>
              <span style="text-align:right">Cost</span>
              <span>Due Date</span>
              <span></span>
            </div>
            ${p.tasks.map(t => `
              <div class="task-row" data-task-id="${t.id}">
                <input
                  class="task-input${t.done ? ' done-task' : ''}"
                  placeholder="Item / task description"
                  value="${escHtml(t.item)}"
                  oninput="updateTask(${p.id}, ${t.id}, 'item', this.value)"
                >
                <input
                  class="cost-input"
                  type="number"
                  min="0"
                  step="0.01"
                  placeholder="0.00"
                  value="${escHtml(t.cost)}"
                  oninput="updateTask(${p.id}, ${t.id}, 'cost', this.value)"
                >
                <input
                  class="task-due-input"
                  type="date"
                  value="${escHtml(t.due || '')}"
                  title="Due date"
                  aria-label="Due date"
                  oninput="updateTask(${p.id}, ${t.id}, 'due', this.value)"
                >
                <button class="btn-delete-task" title="Remove task" onclick="deleteTask(${p.id}, ${t.id})">✕</button>
              </div>
            `).join('')}
            <button class="btn-add-task" onclick="addTask(${p.id})">+ Add Task</button>
          </div>
          ${p.tasks.length > 0 ? `
          <div>
            <div class="progress-bar-wrap">
              <div class="progress-bar" style="width:${pct}%"></div>
            </div>
            <div class="progress-label">${doneCount} / ${p.tasks.length} tasks marked done</div>
          </div>` : ''}
        </div>
        <div class="project-footer">
          <span class="total-label">Estimated Total</span>
          <span class="total-amount" data-total="${p.id}">$${total.toFixed(2)}</span>
        </div>
      `;

      // Wire up done checkboxes after HTML is set (we'll add them differently)
      grid.appendChild(card);

      // Add done-toggle via checkbox injected before each task input
      card.querySelectorAll('.task-row').forEach((row, i) => {
        const task = p.tasks[i];
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.className = 'task-done-checkbox';
        cb.checked = task.done;
        cb.title = 'Mark done';
        cb.setAttribute('aria-label', task.item ? `Mark "${task.item}" done` : 'Mark task done');
        cb.addEventListener('change', () => {
          updateTask(p.id, task.id, 'done', cb.checked);
        });
        row.insertBefore(cb, row.firstChild);
        row.style.gridTemplateColumns = '22px 1fr 72px 104px 28px';
      });
    });

    renderCalendar();
  }

  // ── Calendar ──
  const today = new Date();
  let calYear  = today.getFullYear();
  let calMonth = today.getMonth();

  function renderCalendar() {
    const grid  = document.getElementById('calendarGrid');
    const title = document.getElementById('calTitle');
    if (!grid || !title) return;

    const monthNames = ['January','February','March','April','May','June',
                        'July','August','September','October','November','December'];
    title.textContent = `${monthNames[calMonth]} ${calYear}`;

    const tasksByDate = {};
    projects.forEach(p => {
      p.tasks.forEach(t => {
        if (t.done || !t.due) return;
        if (!tasksByDate[t.due]) tasksByDate[t.due] = [];
        tasksByDate[t.due].push({ project: p.name || 'Unnamed Project', task: t.item || 'Unnamed Task' });
      });
    });

    const firstDay    = new Date(calYear, calMonth, 1).getDay();
    const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
    const daysInPrev  = new Date(calYear, calMonth, 0).getDate();
    const todayStr    = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;

    grid.innerHTML = '';
    let cellCount = 0;

    for (let i = firstDay - 1; i >= 0; i--) {
      const d = daysInPrev - i;
      const m = calMonth === 0 ? 12 : calMonth;
      const y = calMonth === 0 ? calYear - 1 : calYear;
      appendDay(grid, d, `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`, true, todayStr, tasksByDate);
      cellCount++;
    }
    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      appendDay(grid, d, dateStr, false, todayStr, tasksByDate);
      cellCount++;
    }
    const trailing = cellCount % 7 === 0 ? 0 : 7 - (cellCount % 7);
    for (let d = 1; d <= trailing; d++) {
      const m = calMonth === 11 ? 1 : calMonth + 2;
      const y = calMonth === 11 ? calYear + 1 : calYear;
      appendDay(grid, d, `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`, true, todayStr, tasksByDate);
    }
  }

  function appendDay(grid, dayNum, dateStr, otherMonth, todayStr, tasksByDate) {
    const cell = document.createElement('div');
    cell.className = 'cal-day' + (otherMonth ? ' other-month' : '') + (dateStr === todayStr ? ' today' : '');
    const numEl = document.createElement('div');
    numEl.className = 'cal-day-num';
    numEl.textContent = dayNum;
    cell.appendChild(numEl);
    (tasksByDate[dateStr] || []).forEach(item => {
      const chip = document.createElement('div');
      chip.className = 'cal-chip';
      chip.title = `${item.project}: ${item.task}`;
      chip.innerHTML = `${escHtml(item.task)}<span class="chip-project">${escHtml(item.project)}</span>`;
      cell.appendChild(chip);
    });
    grid.appendChild(cell);
  }

  document.getElementById('calPrev').addEventListener('click', () => {
    if (--calMonth < 0) { calMonth = 11; calYear--; }
    renderCalendar();
  });

  document.getElementById('calNext').addEventListener('click', () => {
    if (++calMonth > 11) { calMonth = 0; calYear++; }
    renderCalendar();
  });

  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/"/g, '&quot;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  // ── One-time migration: copy task → item for rows created before the Task column was removed ──
  let migrated = false;
  projects.forEach(p => {
    p.tasks.forEach(t => {
      if (t.task && !t.item) {
        t.item = t.task;
        migrated = true;
      }
      delete t.task;
    });
  });
  if (migrated) save();

  render();
  renderCalendar();
</script>
</body>
</html>
